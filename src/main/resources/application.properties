# Server
server.port=8082

# Neon.tech PostgreSQL — paste your actual Neon connection string here
spring.datasource.url=jdbc:postgresql://ep-XXXXXX.us-east-2.aws.neon.tech/doctor_db?sslmode=require
spring.datasource.username=your_neon_username
spring.datasource.password=your_neon_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Inter-service URLs (via API Gateway)
department.service.url=http://localhost:8080/departments